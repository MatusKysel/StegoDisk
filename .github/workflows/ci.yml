name: CI

on:
  push:
    branches: [master, legacy]
  pull_request:
    branches: [master]

# Toolchains under test (bump the version numbers here when new releases land):
#   - Linux:   GCC 15 (ubuntu-toolchain-r/test PPA) and Clang 22 (apt.llvm.org)
#   - macOS:   Apple Clang shipped with the newest Xcode on macos-latest
#   - Windows: MSVC from the newest Visual Studio on windows-latest
env:
  CMAKE_VERSION: 4.4.3
  GCC_VERSION: 15
  CLANG_VERSION: 22

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-gcc
            os: ubuntu-latest
            toolchain: gcc
          - name: ubuntu-clang
            os: ubuntu-latest
            toolchain: clang
          - name: macos-appleclang
            os: macos-latest
          - name: windows-msvc
            os: windows-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python for build tools
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install CMake ${{ env.CMAKE_VERSION }} and Ninja
        run: python -m pip install --upgrade "cmake==${{ env.CMAKE_VERSION }}" ninja

      - name: Install GCC ${{ env.GCC_VERSION }} (Linux)
        if: matrix.toolchain == 'gcc'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-$GCC_VERSION g++-$GCC_VERSION libtbb-dev zlib1g-dev
          echo "CC=gcc-$GCC_VERSION" >> "$GITHUB_ENV"
          echo "CXX=g++-$GCC_VERSION" >> "$GITHUB_ENV"

      - name: Install Clang ${{ env.CLANG_VERSION }} (Linux)
        if: matrix.toolchain == 'clang'
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh $CLANG_VERSION
          sudo apt-get install -y libtbb-dev zlib1g-dev
          echo "CC=clang-$CLANG_VERSION" >> "$GITHUB_ENV"
          echo "CXX=clang++-$CLANG_VERSION" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          extra=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Tests build the temp path into a C string, so it must use forward slashes.
            extra+=(-A x64 "-DTEST_DIR=$(cygpath -m "$RUNNER_TEMP")/")
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            extra+=(-G "Ninja Multi-Config")
          fi
          cmake --version
          cmake -S . -B out -DCMAKE_BUILD_TYPE=Release -DVERSION_NAMES=1 \
            "${extra[@]}"

      - name: Report toolchain
        shell: bash
        run: grep -E "CMAKE_(C|CXX)_COMPILER(:|_VERSION)" out/CMakeCache.txt || true

      - name: Build
        run: cmake --build out --config Release --parallel 4

      - name: Test
        run: ctest --test-dir out --build-config Release -L stegodisk --output-on-failure --parallel 4 --timeout 600 --no-tests=error

      - name: Build and test Debug configuration
        if: runner.os == 'macOS'
        run: cmake --build out --config Debug --target check --parallel 4

  # The FUSE backend is off by default, so nothing else in CI compiles it and
  # it silently rotted: it had not been built since the refactor in #59. This
  # job exists to keep it compiling. The mount itself is not exercised, which
  # would need privileges the runner does not grant; stego-fuse-test is built
  # but is deliberately not registered with ctest.
  linux-fuse:
    name: ubuntu-gcc-fuse
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python for build tools
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install CMake ${{ env.CMAKE_VERSION }} and Ninja
        run: python -m pip install --upgrade "cmake==${{ env.CMAKE_VERSION }}" ninja

      - name: Install GCC ${{ env.GCC_VERSION }} and libfuse
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-$GCC_VERSION g++-$GCC_VERSION \
            libtbb-dev zlib1g-dev libfuse-dev pkg-config
          echo "CC=gcc-$GCC_VERSION" >> "$GITHUB_ENV"
          echo "CXX=g++-$GCC_VERSION" >> "$GITHUB_ENV"
          pkg-config --modversion fuse

      - name: Configure with FUSE enabled
        run: cmake -S . -B out-fuse -DCMAKE_BUILD_TYPE=Release -DVERSION_NAMES=1 -DWITH_FUSE=ON

      - name: Build
        run: cmake --build out-fuse --config Release --parallel 4

      - name: Confirm the FUSE sources were actually compiled
        run: |
          test -f out-fuse/bin/stego-fuse-test \
            || { echo "::error::stego-fuse-test was not built"; exit 1; }
          echo "FUSE backend and stego-fuse-test built."

      - name: Test
        run: >-
          ctest --test-dir out-fuse --build-config Release -L stegodisk
          --output-on-failure --parallel 4 --timeout 600 --no-tests=error
