# Measure the built library sources, excluding test code and bundled lib/ sources.
root = .
filter = src/
exclude = src/tests/

# Omit compiler-generated exception and unreachable branches from branch totals.
exclude-unreachable-branches = yes
exclude-throw-branches = yes

# Full carrier round trips execute Keccak round loops over 10 billion times.
# Raise only this hit-count heuristic; malformed/negative gcov data still fails.
gcov-suspicious-hits-threshold = 1000000000000
